/* Base Card Styling */
.card {
  width: 95%;
  max-width: 500px;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 32px;
  padding: 30px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  position: relative;
  margin: 20px auto;
}

/* REPAIRED MEDIA QUERY FOR LANDSCAPE */
@media (max-width: 1024px) and (orientation: landscape) {
  body {
    align-items: flex-start !important; /* Allow content to start at top and scroll */
    overflow-y: auto !important;      /* Enable page-level scrolling */
    padding: 20px 0;
  }

  .card {
    max-height: none !important;      /* Remove 100vh limit to show all buttons */
    overflow-y: visible !important;   /* Let card expand to fit its content */
    margin-top: 10px;
    margin-bottom: 10px;
    padding: 20px;
  }

  h1 {
    font-size: 3rem !important;       /* Scaled for smaller height */
    margin-bottom: 15px !important;
  }

  .menu-btns {
    gap: 12px !important;            /* Slightly tighter gap to save space */
  }
}

h1 {
  font-family: 'Bangers', cursive;
  font-size: 4.5rem;
  color: #fff;
  text-shadow: 4px 4px 0px #FF2D78, 8px 8px 0px rgba(0,0,0,0.2);
  margin-bottom: 30px;
  letter-spacing: 2px;
  line-height: 1;
}

.menu-btns {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.btn {
  background: white;
  border: none;
  padding: 18px;
  border-radius: 20px;
  font-size: 1.4rem;
  font-weight: 900;
  color: #FF2D78;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  box-shadow: 0 6px 0px #eee, 0 12px 20px rgba(0,0,0,0.1);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.btn:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0px #eee, 0 5px 10px rgba(0,0,0,0.1);
}

.btn-primary {
  background: linear-gradient(135deg, #FF2D78, #FF7777);
  color: white;
  box-shadow: 0 6px 0px #C11D56, 0 12px 20px rgba(255, 45, 120, 0.3);
}

.btn-primary:active {
  box-shadow: 0 2px 0px #C11D56, 0 5px 10px rgba(255, 45, 120, 0.3);
}
